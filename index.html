<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Something for you 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="song" src="music.mp3" loop preload="auto"></audio>

<button id="mute" type="button" aria-label="Toggle music">🔊</button>

<main>
  <!-- Screen 1: ask for name -->
  <section class="screen on" id="s1">
    <h1>Hey you 💌</h1>
    <p class="sub">I made something just for you.<br>What's your name?</p>
    <input id="name" type="text" placeholder="Type your name" maxlength="30" autocomplete="given-name" aria-label="Your name">
    <br>
    <button class="go" id="open" type="button">Open it 🎁</button>
    <p class="hint">🎵 Turn your sound on</p>
  </section>

  <!-- Screen 2: photo + message -->
  <section class="screen" id="s2">
    <p class="hello" id="hello"></p>
    <div class="frame">
      <img src="photo.jpg" alt="A smiling girl in a checked school uniform">
    </div>
    <p class="msg">Girl, save some beauty for the rest of us 😭</p>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
